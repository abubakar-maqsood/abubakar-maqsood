<svg xmlns='http://www.w3.org/2000/svg' width='960' height='170' viewBox='0 0 960 170'><defs><linearGradient id='bg' x1='0' x2='1' y1='0' y2='1'><stop offset='0%' stop-color='#0b1f31'/><stop offset='100%' stop-color='#12273b'/></linearGradient><linearGradient id='track' x1='0' x2='1'><stop offset='0%' stop-color='#214559'/><stop offset='100%' stop-color='#2c5f75'/></linearGradient><linearGradient id='snakeGrad' x1='0' x2='1'><stop offset='0%' stop-color='#29d6c0'/><stop offset='100%' stop-color='#8df2dc'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='6' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter><path id='trackPath' d='M360 110 C425 78 493 128 560 95 S693 61 748 92 815 128 882 98'/></defs><rect width='960' height='170' rx='24' fill='url(#bg)'/><rect x='1' y='1' width='958' height='168' rx='23' fill='none' stroke='#29506a'/><text x='34' y='45' font-family='Arial, Helvetica, sans-serif' font-size='18' font-weight='700' fill='#ecfbf7'>CONTRIBUTION SNAKE</text><text x='34' y='72' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#a8c8d3'>Improved preview: the snake follows a visible track. Real contribution snake appears after workflow sync.</text><g opacity='0.8'><use href='#trackPath' fill='none' stroke='url(#track)' stroke-width='12' stroke-linecap='round'/><use href='#trackPath' fill='none' stroke='#173243' stroke-width='5' stroke-linecap='round' stroke-dasharray='1 18'/></g><g fill='#1f4f55'><rect x='360' y='125' width='15' height='15' rx='4'/><rect x='384' y='116' width='15' height='15' rx='4'/><rect x='408' y='128' width='15' height='15' rx='4'/><rect x='432' y='116' width='15' height='15' rx='4'/><rect x='456' y='125' width='15' height='15' rx='4'/><rect x='480' y='112' width='15' height='15' rx='4'/><rect x='504' y='126' width='15' height='15' rx='4'/><rect x='528' y='114' width='15' height='15' rx='4'/><rect x='552' y='126' width='15